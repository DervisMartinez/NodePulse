# 1. Zona de Rate Limiting para la API (10 req/s por IP)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_status 429;

# 2. Formato de Logs de acceso estructurados en JSON
log_format json_analytics escape=json
  '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method",'
  '"uri":"$request_uri","status":$status,"body_bytes":$body_bytes_sent,'
  '"duration":$request_time,"agent":"$http_user_agent"}';

server {
    listen 80;
    server_name localhost;

    # Activar logs en JSON
    access_log /var/log/nginx/access.log json_analytics;

    # 3. Cabeceras de seguridad HTTP globales
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # 4. Compresión Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Ruta de salud: SIN rate limit
    location = /gateway-health {
        access_log off;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API: Con Rate Limiting y página de error JSON
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;

        proxy_pass http://api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors on;
        error_page 502 503 /error.json;
    }

    location = /error.json {
        root /usr/share/nginx/html;
        internal;
    }

    # Frontend Web
    location / {
        proxy_pass http://web:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
