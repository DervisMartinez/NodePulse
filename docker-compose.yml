services:
  db:
    build:
      context: ./db
      dockerfile: Dockerfile
    container_name: monitoreo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitor_user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD: copia .env.example a .env}"
      POSTGRES_DB: ${POSTGRES_DB:-monitor_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - datos
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitor_user} -d ${POSTGRES_DB:-monitor_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: monitoreo_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${API_PORT:-3000}
      DATABASE_URL: "postgresql://${POSTGRES_USER:-monitor_user}:${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD: copia .env.example a .env}@db:5432/${POSTGRES_DB:-monitor_db}"
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      TASK_STALE_MS: ${TASK_STALE_MS:-60000}
    networks:
      - frontal
      - datos
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: monitoreo_worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
      WORKER_NAME: worker-01
      WORKER_POLL_MS: ${WORKER_POLL_MS:-3000}
      WORKER_MAX_RETRIES: ${WORKER_MAX_RETRIES:-3}
      TASK_DURATION_MS: ${TASK_DURATION_MS:-1500}
      WORKER_BACKOFF_MS: ${WORKER_BACKOFF_MS:-1000}
    networks:
      - datos
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); const age=Date.now()-fs.statSync('/tmp/worker.alive').mtimeMs; process.exit(age<30000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: monitoreo_collector
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_URL: http://api:3000
      NODE_NAME: ${COLLECTOR_NODE_NAME:-nodo-facyt-01}
      COLLECTOR_INTERVAL_MS: ${COLLECTOR_INTERVAL_MS:-5000}
      COLLECTOR_MEMORY_SOURCE: ${COLLECTOR_MEMORY_SOURCE:-cgroup}
    networks:
      - datos
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs'); const age=Date.now()-fs.statSync('/tmp/collector.alive').mtimeMs; process.exit(age<30000?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: monitoreo_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks:
      - frontal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: monitoreo_gateway
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:80"
    networks:
      - frontal
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  frontal:
    driver: bridge
  datos:
    driver: bridge

volumes:
  postgres_data:
